<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinema Seat Layout</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">
  <style>
    .card {
      min-height: 100%;
    }
    .toggle-btns button.active {
      background-color: #0d6efd !important;
      color: white !important;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center mb-4">🎟️ Theater Management Dashboard</h2>

    <!-- Seat Map -->
    <div class="card shadow-sm p-4 mb-5">
      <h4 class="mb-3 text-center">Seat Map</h4>
      <div id="seat-container" class="d-flex justify-content-center align-items-center flex-wrap"></div>
    </div>

    <!-- Toggle Button for all sections -->
    <div class="d-flex justify-content-center mb-4">
      <button id="toggle-all" class="btn btn-success w-50" type="button">
        Open Box Office
      </button>
    </div>

    <!-- Row of 3 Cards -->
    <div class="row g-4 align-items-stretch">

      <!-- Book Seat -->
      <div class="col-lg-4 col-md-6 d-flex">
        <div class="collapse multi-collapse w-100" id="booking-card">
          <div class="card shadow-sm p-4 h-100">
            <div class="toggle-btns d-flex justify-content-between mb-3">
              <button id="show-book-form" class="btn btn-outline-primary w-50 me-1 active">Book Seat</button>
              <button id="show-cancel-form" class="btn btn-outline-danger w-50 ms-1">Cancel Seat</button>
            </div>

            <!-- BOOK FORM -->
            <form id="booking-form">
              <h5 class="mb-3">Book Your Seat</h5>

              <div class="row mb-3 align-items-center">
                <label for="name" class="col-sm-4 col-form-label">Name</label>
                <div class="col-sm-8">
                  <input type="text" class="form-control" id="name" placeholder="Your name" required>
                </div>
              </div>

              <div class="row mb-3 align-items-center">
                <label for="row" class="col-sm-4 col-form-label">Row</label>
                <div class="col-sm-8">
                  <input type="number" class="form-control" id="row" placeholder="Row #" min="1" required>
                </div>
              </div>

              <div class="row mb-3 align-items-center">
                <label for="col" class="col-sm-4 col-form-label">Column</label>
                <div class="col-sm-8">
                  <input type="number" class="form-control" id="col" placeholder="Col #" min="1" required>
                </div>
              </div>

              <div class="row mb-3 align-items-center">
                <label for="snacks" class="col-sm-4 col-form-label">Snacks</label>
                <div class="col-sm-8">
                  <select class="form-select" id="snacks" required>
                    <option value="N" selected>No</option>
                    <option value="Y">Yes</option>
                  </select>
                </div>
              </div>

              <button type="button" class="btn btn-primary w-100" id="book-ticket">Book</button>
            </form>

            <!-- CANCEL FORM -->
            <form id="cancel-form" class="d-none">
              <h5 class="mb-3">Cancel Seat</h5>
              <div class="row mb-3 align-items-center">
                <label for="cancel-row" class="col-sm-4 col-form-label">Row</label>
                <div class="col-sm-8">
                  <input type="number" class="form-control" id="cancel-row" placeholder="Row #" min="1" required>
                </div>
              </div>
              <div class="row mb-3 align-items-center">
                <label for="cancel-col" class="col-sm-4 col-form-label">Column</label>
                <div class="col-sm-8">
                  <input type="number" class="form-control" id="cancel-col" placeholder="Col #" min="1" required>
                </div>
              </div>
              <button type="button" class="btn btn-danger w-100" id="cancel-ticket">Cancel Seat</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Booking History -->
      <div class="col-lg-4 col-md-6 d-flex">
        <div class="collapse multi-collapse w-100" id="history-card">
          <div class="card shadow-sm p-4 h-100">
            <h4 class="mb-3">Booking History</h4>
            <div class="row mb-3">
              <div class="col-6">
                <button type="button" class="btn btn-secondary w-100" id="show-history">Show</button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-secondary w-100" id="clear-history">Clear</button>
              </div>
            </div>
            <textarea id="history-textarea" class="form-control" rows="10" readonly placeholder="Booking history will appear here..."></textarea>
          </div>
        </div>
      </div>

      <!-- Search Tickets -->
      <div class="col-lg-4 col-md-6 d-flex">
        <div class="collapse multi-collapse w-100" id="search-card">
          <div class="card shadow-sm p-4 h-100">
            <h4 class="mb-3">Search Tickets</h4>
            <div class="row g-2 align-items-center mb-3">
              <div class="col-3">
                <label for="search-name" class="col-form-label">Name</label>
              </div>
              <div class="col-9">
                <input type="text" class="form-control" id="search-name" placeholder="Enter name" required>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <button type="button" class="btn btn-info w-100" id="search-ticket">Search</button>
              </div>
              <div class="col-6">
                <button type="button" class="btn btn-secondary w-100" id="clear-search">Clear</button>
              </div>
            </div>

            <textarea id="search-results" class="form-control" rows="10" readonly placeholder="Search results will appear here..."></textarea>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./script.js"></script>
</body>
</html>
